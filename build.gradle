plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.boes'
version = '1.6.0'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://jitpack.io" }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    implementation("org.incendo:cloud-core:2.0.0")
    implementation("org.incendo:cloud-annotations:2.0.0")
    implementation("org.incendo:cloud-paper:2.0.0-beta.16")
    implementation("org.xerial:sqlite-jdbc:3.46.1.3")
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// --- Local server deployment ---

tasks.register("deployPlugin") {
    dependsOn shadowJar

    doLast {
        project.delete fileTree("$rootDir/server/plugins") {
            include "${project.name}-*.jar"
        }

        project.copy {
            from shadowJar.archiveFile
            into "$rootDir/server/plugins"
        }
    }
}

tasks.register("deployAndRestart") {
    dependsOn deployPlugin

    doLast {
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

        if (isWindows) {
            new ProcessBuilder("cmd", "/c", "$rootDir\\restart-server.bat")
                .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                .redirectError(ProcessBuilder.Redirect.DISCARD)
                .start()
        } else {
            new ProcessBuilder("bash", "$rootDir/restart-server.sh")
                .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                .redirectError(ProcessBuilder.Redirect.DISCARD)
                .start()
        }
    }
}
